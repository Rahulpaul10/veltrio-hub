# Netlify build settings for Veltrio (static single-page app).
[build]
  command = "bun install --frozen-lockfile && bun run build && bun run verify:build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Documented Netlify variable: pins the Bun version used for the build (matches .bun-version).
  BUN_VERSION = "1.3.14"

# Single-page app routing: /send, /receive and /activity must serve index.html.
# Real files (assets) are served first because the redirect is not forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
